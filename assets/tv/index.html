<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MusicHive</title>
  <link rel="stylesheet" href="tv.css">
</head>
<body>
  <!-- What MusicHive casts to a browser: the visualiser, the lyrics and what plays.
       MusicHive serves this page while you cast to "Web Browser"; tv.js does the rest. -->
  <canvas id="background"></canvas>
  <div id="dim"></div>
  <canvas id="bars"></canvas>

  <main id="lyrics">
    <div id="lines"></div>
  </main>

  <footer id="info">
    <img id="cover" alt="">
    <div id="text">
      <div id="title"></div>
      <!-- The artist and album are cut short when long; "added by" always shows. -->
      <div id="artistLine">
        <span id="artist"></span>
        <span id="addedBy" hidden></span>
      </div>
      <div id="progress">
        <span id="elapsed"></span>
        <div id="track"><div id="fill"></div></div>
        <span id="length"></span>
      </div>
    </div>
    <!-- Lucide icons (ISC licence): skip-back, play, pause, skip-forward, qr-code -->
    <nav id="controls">
      <button id="previous" class="control" aria-label="Previous">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.971 4.285A2 2 0 0 1 21 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z"/><path d="M3 20V4"/></svg>
      </button>
      <button id="playPause" class="control large" aria-label="Play or pause">
        <svg class="play" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>
        <svg class="pause" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></svg>
      </button>
      <button id="next" class="control" aria-label="Next">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4v16"/><path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"/></svg>
      </button>
      <!-- Only during a party: shows or hides the code guests scan. -->
      <button id="partyButton" class="control" aria-label="Party QR code" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></svg>
      </button>
    </nav>
  </footer>

  <!-- Party Mode: the code guests scan to add songs, in the corner. -->
  <aside id="party" hidden>
    <img id="partyQr" alt="">
    <div id="partyText"></div>
    <div id="partyAddress"></div>
  </aside>

  <div id="start">
    <button id="startButton" autofocus>Start</button>
    <p>Press OK once so this browser may play MusicHive's music.</p>
  </div>
  <div id="waiting">Waiting for MusicHive…</div>

  <audio id="player" preload="auto"></audio>
  <script src="tv.js"></script>
</body>
</html>

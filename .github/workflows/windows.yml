# Builds the Windows installer and portable zip after every push to master or
# windows-build, and on a manual run (Actions > Windows build > Run workflow);
# they are kept as a downloadable artifact of the run. On a published release
# they are also added to the release.
name: Windows build

on:
  push:
    branches: [master, windows-build]
  release:
    types: [published]
  workflow_dispatch:

# A newer push makes an unfinished build of the same branch pointless.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git

      - name: Build
        shell: msys2 {0}
        run: |
          git config --global --add safe.directory "$PWD"
          packaging/windows/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: MusicHive-windows
          path: dist/MusicHive-*-windows-x64*

      - name: Add to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/MusicHive-*-windows-x64* --clobber
